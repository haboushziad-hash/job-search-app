[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.0", features = [] }
tauri-plugin-log = "2"
# Sidecar shell plugin — used to spawn the bundled Python FastAPI backend
# on app launch and tear it down on quit.
tauri-plugin-shell = "2"
# Auto-updater. Polls a manifest URL on app startup; if a newer version
# is published, the JS side shows a toast and (with user consent) downloads
# + applies the signed update bundle. Server side is a Cloudflare Worker
# endpoint that reads R2 for the latest manifest. See
# /v1/update/latest.json on the worker.
tauri-plugin-updater = "2"
# UUID v4 generation for anonymous per-tester identification.
# Generated on first launch, persisted to app data folder, sent to the
# backend as TESTER_UUID env var so audit JSONs can be uploaded keyed
# to a stable but anonymous identity.
uuid = { version = "1.10", features = ["v4"] }
