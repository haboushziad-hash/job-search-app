<!--
  Z mark for findmesomedamnjobz.
  - 1024×1024 source for Tauri icon generation (run `npx @tauri-apps/cli icon` on a PNG export).
  - Bold geometric Z + sparkle accent — hints at AI without being literal.
  - Purple gradient matches brand. Rounded square background matches OS app-icon conventions.

  Note on the Z path: it's drawn as a SINGLE closed polygon (10 vertices) tracing
  the outer outline of the letter — not three overlapping rectangles like the
  earlier version. Three-rect approach created visible joins at the diagonal/
  horizontal-bar intersections that read as a "broken" or graffiti'd Z. The
  single-polygon approach has no internal seams.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a47cff"/>
      <stop offset="0.55" stop-color="#8856ff"/>
      <stop offset="1" stop-color="#5a2cd1"/>
    </linearGradient>
    <linearGradient id="zfill" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f0e9ff"/>
    </linearGradient>
    <!-- Soft shadow under the Z for depth — kept subtle so the letter stays
         crisp (the previous full glow blurred too much and contributed to the
         disjointed appearance). -->
    <filter id="zshadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded-square background (Apple/Windows icon proportions: 22% corner radius) -->
  <rect x="0" y="0" width="1024" height="1024" rx="225" ry="225" fill="url(#bg)"/>

  <!-- Subtle inner highlight for depth -->
  <rect x="0" y="0" width="1024" height="1024" rx="225" ry="225"
        fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="6"/>

  <!-- The Z — single closed polygon outline. Vertices traced clockwise:
         1. (280, 296) — top-left of top bar
         2. (740, 296) — top-right of top bar
         3. (740, 406) — bottom-right of top bar (start of diagonal's right edge)
         4. (415, 618) — diagonal meets the top edge of the bottom bar
         5. (740, 618) — continues along bottom bar's top edge to top-right
         6. (740, 728) — bottom-right of bottom bar
         7. (280, 728) — bottom-left of bottom bar
         8. (280, 618) — top of bottom bar's left edge
         9. (605, 406) — diagonal's upper end on top bar's bottom edge
        10. (280, 406) — bottom-left of top bar
       Closed back to (280, 296). Slight -3deg rotation for energy. -->
  <g transform="translate(512 512) rotate(-3) translate(-512 -512)" filter="url(#zshadow)">
    <path d="M 280 296
             L 740 296
             L 740 406
             L 415 618
             L 740 618
             L 740 728
             L 280 728
             L 280 618
             L 605 406
             L 280 406
             Z"
          fill="url(#zfill)"/>
  </g>

  <!-- Sparkle accent (top-right) — hints at AI-powered without being literal -->
  <g transform="translate(800 200)" fill="#ffffff" opacity="0.95">
    <path d="M 0 -64
             C 4 -28 12 -20 48 -16
             C 12 -12 4 -4 0 32
             C -4 -4 -12 -12 -48 -16
             C -12 -20 -4 -28 0 -64 Z"/>
  </g>
  <!-- Tiny secondary sparkle for asymmetric balance -->
  <g transform="translate(870 290)" fill="#ffffff" opacity="0.7">
    <path d="M 0 -22
             C 2 -10 4 -8 16 -6
             C 4 -4 2 -2 0 12
             C -2 -2 -4 -4 -16 -6
             C -4 -8 -2 -10 0 -22 Z"/>
  </g>
</svg>
