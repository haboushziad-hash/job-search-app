name: Build desktop installers

# Builds the .msi (Windows) and .dmg (macOS) for every push to main.
# Also signs + publishes the auto-update bundles + manifest.json so
# existing tester installs auto-update on next launch.
#
# Required setup (one-time):
#   1. Push this repo to GitHub
#   2. Add GHA secrets:
#      - CLOUDFLARE_API_TOKEN          (for R2 uploads + Worker deploy)
#      - TAURI_SIGNING_PRIVATE_KEY     (contents of ~/.tauri/<app>.key)
#      - TAURI_SIGNING_PRIVATE_KEY_PASSWORD  (the password set during keygen)
#   3. The workflow runs automatically on push to main
#   4. To ship an update: bump the `version` field in
#      desktop_app/src-tauri/tauri.conf.json + desktop_app/src-tauri/Cargo.toml
#      + desktop_app/package.json, push to main, GHA does the rest.

on:
  push:
    branches: [main]
    # Skip the (slow) desktop build for landing-only / docs-only changes.
    # The landing site has its own Cloudflare Pages auto-deploy that fires
    # regardless of these filters. So pushing landing tweaks → only Pages
    # rebuilds, this 12-min installer build sits out.
    paths-ignore:
      - 'landing/**'
      - 'cf_worker/**'
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            artifact_pattern: "**/*.msi"
            artifact_name: windows-installer
            r2_key: "current/job-search-app.msi"
            target_triple: "x86_64-pc-windows-msvc"
            # Tauri 2 generates an NSIS update bundle alongside the MSI when
            # createUpdaterArtifacts is true. The updater downloads this
            # bundle (a zip containing the silent-install NSIS .exe) instead
            # of the MSI, since the MSI requires UAC prompt + manual click.
            update_glob: "**/bundle/nsis/*-setup.nsis.zip"
            update_platform_key: "windows-x86_64"
          - os: macos-latest                  # Apple Silicon (arm64)
            target: macos-arm64
            artifact_pattern: "**/*.dmg"
            artifact_name: macos-arm64-installer
            r2_key: "current/job-search-app-aarch64.dmg"
            target_triple: "aarch64-apple-darwin"
            update_glob: "**/bundle/macos/*.app.tar.gz"
            update_platform_key: "darwin-aarch64"
          # macos-13 (Intel) intentionally NOT in the default matrix.
          # GitHub's macOS-13 runners are chronically queue-starved (often
          # hours of wait), which blocks the publish-manifest aggregator
          # job. Most testers are on Apple Silicon (2020+) anyway. To
          # include it for a specific release, manually run the workflow
          # with workflow_dispatch + matrix override, or temporarily
          # un-comment this entry and push.
          # - os: macos-13
          #   target: macos-x64
          #   artifact_pattern: "**/*.dmg"
          #   artifact_name: macos-x64-installer
          #   r2_key: "current/job-search-app-x64.dmg"
          #   target_triple: "x86_64-apple-darwin"
          #   update_glob: "**/bundle/macos/*.app.tar.gz"
          #   update_platform_key: "darwin-x86_64"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # ---- Frontend (React + Vite + Tauri shell) ----
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: desktop_app/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop_app
        run: npm ci

      # ---- Backend (Python + PyInstaller) ----
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          python -m venv backend\venv
          backend\venv\Scripts\python.exe -m pip install -r backend\requirements.txt
          backend\venv\Scripts\python.exe -m pip install pyinstaller playwright
          backend\venv\Scripts\python.exe -m playwright install chromium

      - name: Install backend dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m venv backend/venv
          backend/venv/bin/python -m pip install -r backend/requirements.txt
          backend/venv/bin/python -m pip install pyinstaller playwright
          backend/venv/bin/python -m playwright install chromium

      - name: Bundle backend with PyInstaller (Windows)
        if: matrix.os == 'windows-latest'
        run: backend\venv\Scripts\python.exe -m PyInstaller backend.spec

      - name: Bundle backend with PyInstaller (macOS)
        if: runner.os == 'macOS'
        run: backend/venv/bin/python -m PyInstaller backend.spec

      # PyInstaller drops the binary at dist/backend(.exe). Tauri's externalBin
      # config expects it at desktop_app/src-tauri/binaries/backend-<target-triple>(.exe)
      # — so we copy + rename here. The binaries/ dir is gitignored (binaries
      # are 100+ MB; rebuilt fresh per CI run).
      - name: Stage backend binary for Tauri (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p desktop_app/src-tauri/binaries
          cp dist/backend.exe "desktop_app/src-tauri/binaries/backend-${{ matrix.target_triple }}.exe"
          ls -la desktop_app/src-tauri/binaries/

      - name: Stage backend binary for Tauri (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p desktop_app/src-tauri/binaries
          cp dist/backend "desktop_app/src-tauri/binaries/backend-${{ matrix.target_triple }}"
          chmod +x "desktop_app/src-tauri/binaries/backend-${{ matrix.target_triple }}"
          ls -la desktop_app/src-tauri/binaries/

      # ---- Tauri build (Rust + sidecar packaging + signed update bundles) ----
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop_app/src-tauri/target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('desktop_app/src-tauri/Cargo.lock') }}

      # Tauri reads TAURI_SIGNING_PRIVATE_KEY at build time and signs the
      # update bundle (NSIS .zip on Windows, .app.tar.gz on macOS). The
      # signature file lands next to the bundle. Without these env vars
      # set, Tauri builds the regular installer but skips the update
      # bundle — meaning auto-update wouldn't work. We set them on every
      # build so the manifest publish step always has fresh signatures.
      - name: Build Tauri (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: desktop_app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Build Tauri (macOS)
        if: runner.os == 'macOS'
        working-directory: desktop_app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          # On macOS, Tauri 2 outputs to target/<triple>/release/bundle/...
          # (target/aarch64-apple-darwin/... or target/x86_64-apple-darwin/...).
          # Windows uses the bare target/release/bundle/. The double-glob
          # catches both layouts. NOTE: change if-no-files-found to ERROR so
          # we surface this kind of regression instead of silently passing.
          path: desktop_app/src-tauri/target/**/bundle/${{ matrix.artifact_pattern }}
          if-no-files-found: error
          retention-days: 30

      # ---- Auto-publish installer to Cloudflare R2 ----
      # Uploads to keys that the Worker's /v1/dl/<platform> route streams from.
      # The Worker's origin lock keeps the file from being downloaded except
      # via the landing page.

      - name: Install wrangler
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: npm install -g wrangler

      - name: Read app version
        id: version
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          # Single source of truth: tauri.conf.json's version field.
          # Cargo.toml + package.json should match (Tauri's release docs say
          # to keep these three in sync; manifest reflects this version).
          VERSION=$(node -p "require('./desktop_app/src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      - name: Publish installer to R2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          # Tauri 2 outputs to different paths per platform:
          #   - Windows:  target/release/bundle/msi/*.msi
          #   - Mac arm:  target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          #   - Mac x64:  target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          # The wildcard matches all three.
          BASE="desktop_app/src-tauri/target"
          if [ "${{ runner.os }}" = "Windows" ]; then
            FILE=$(find "$BASE" -path "*/bundle/msi/*.msi" -type f | head -1)
          else
            FILE=$(find "$BASE" -path "*/bundle/dmg/*.dmg" -type f | head -1)
          fi
          if [ -z "$FILE" ]; then
            echo "no installer found — searched under $BASE"
            find "$BASE" -name "*.dmg" -o -name "*.msi" || true
            exit 1
          fi
          echo "Found installer: $FILE"
          echo "Uploading to R2 key: ${{ matrix.r2_key }}"
          wrangler r2 object put "fmsdj-installers/${{ matrix.r2_key }}" --file "$FILE" --content-type "application/octet-stream" --remote

      # ---- Auto-update bundle + signature → R2 ----
      # After tauri build with signing keys set, two extra files appear:
      #   Windows: bundle/nsis/<app>_<version>_x64-setup.nsis.zip + .sig
      #   macOS:   bundle/macos/<app>.app.tar.gz                 + .sig
      # Upload both to a versioned R2 path. The .sig is a single line of
      # base64 — we also capture it as a workflow output so the next job
      # (publish-manifest) can include it in manifest.json without having
      # to re-download the file from R2.
      - name: Publish update bundle to R2
        id: upload_update
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          BASE="desktop_app/src-tauri/target"
          BUNDLE=$(find "$BASE" -path "${{ matrix.update_glob }}" -type f | head -1)
          if [ -z "$BUNDLE" ]; then
            echo "::warning::No update bundle found at ${{ matrix.update_glob }} — auto-update for this platform will not work this build"
            echo "available bundle outputs:"
            find "$BASE" -path "*/bundle/*" -type f | head -50 || true
            exit 0
          fi
          SIG="${BUNDLE}.sig"
          if [ ! -f "$SIG" ]; then
            echo "::warning::Update bundle present but signature missing — TAURI_SIGNING_PRIVATE_KEY may not be set"
            exit 0
          fi
          BUNDLE_NAME=$(basename "$BUNDLE")
          KEY_BASE="current/update/${VERSION}/${{ matrix.update_platform_key }}"
          BUNDLE_KEY="${KEY_BASE}/${BUNDLE_NAME}"
          SIG_KEY="${KEY_BASE}/${BUNDLE_NAME}.sig"
          echo "Uploading bundle: $BUNDLE_KEY"
          wrangler r2 object put "fmsdj-installers/${BUNDLE_KEY}" --file "$BUNDLE" --content-type "application/octet-stream" --remote
          echo "Uploading signature: $SIG_KEY"
          wrangler r2 object put "fmsdj-installers/${SIG_KEY}" --file "$SIG" --content-type "text/plain" --remote
          # Capture the signature contents + bundle name for the manifest job
          SIG_CONTENTS=$(cat "$SIG")
          {
            echo "bundle_name=$BUNDLE_NAME"
            echo "bundle_key=$BUNDLE_KEY"
            # Signature is a single-line base64 string; quote-escape just in case
            echo "signature<<__SIG_EOF__"
            echo "$SIG_CONTENTS"
            echo "__SIG_EOF__"
          } >> "$GITHUB_OUTPUT"

      # Save just the signature + URL info so the manifest job can pick it
      # up via download-artifact. We use a tiny JSON file because GH outputs
      # don't cross job boundaries cleanly.
      - name: Save platform manifest fragment
        if: |
          (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
          && steps.upload_update.outputs.bundle_name != ''
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUNDLE_NAME: ${{ steps.upload_update.outputs.bundle_name }}
          SIGNATURE: ${{ steps.upload_update.outputs.signature }}
          PLATFORM_KEY: ${{ matrix.update_platform_key }}
        run: |
          mkdir -p manifest-fragments
          DOWNLOAD_URL="https://api.findmesomedamnjobz.com/v1/update/download/${PLATFORM_KEY}/${VERSION}/${BUNDLE_NAME}"
          # Single-line JSON for easy concatenation in the manifest job
          jq -n \
            --arg platform "$PLATFORM_KEY" \
            --arg signature "$SIGNATURE" \
            --arg url "$DOWNLOAD_URL" \
            '{($platform): {signature: $signature, url: $url}}' \
            > "manifest-fragments/${PLATFORM_KEY}.json"
          cat "manifest-fragments/${PLATFORM_KEY}.json"

      - name: Upload manifest fragment
        if: |
          (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
          && steps.upload_update.outputs.bundle_name != ''
        uses: actions/upload-artifact@v4
        with:
          name: manifest-fragment-${{ matrix.update_platform_key }}
          path: manifest-fragments/${{ matrix.update_platform_key }}.json
          retention-days: 1

  # Aggregator job that runs once after all platform builds finish.
  # Downloads each platform's manifest fragment, merges them into the
  # final Tauri-shaped update manifest, and uploads it to R2. The Worker
  # serves this exact JSON at /v1/update/latest.json on every app launch.
  #
  # GATING: this job ONLY runs on tag pushes (`v0.1.x`) or manual
  # workflow_dispatch. Plain pushes to main run the build for CI safety
  # but DO NOT publish a new manifest. This prevents accidental ship-to-
  # testers when iterating on code locally — the operator must explicitly
  # tag a release or hit "Run workflow" in the GitHub Actions UI to push
  # a new version into the auto-update channel.
  #
  # `always()` is layered on top so that even if some matrix entries
  # failed/cancelled (e.g., a macOS-13 Intel runner stalled and was
  # cancelled), the manifest still publishes for the platforms that did
  # succeed. The `add // {}` merge in the manifest builder handles
  # missing platforms gracefully — testers on those platforms just don't
  # see an update offered until the next release, which is correct.
  publish-manifest:
    needs: build
    # Tag-only or manual-trigger releases. Pushes to main do NOT publish.
    if: |
      always() &&
      (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all manifest fragments
        uses: actions/download-artifact@v4
        with:
          path: manifest-fragments
          pattern: manifest-fragment-*
          merge-multiple: true

      - name: Read app version
        id: version
        run: |
          VERSION=$(node -p "require('./desktop_app/src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build manifest.json
        run: |
          # Tauri 2 update-manifest schema:
          # {
          #   "version": "X.Y.Z",
          #   "notes": "...",
          #   "pub_date": "ISO 8601 with TZ",
          #   "platforms": {
          #     "windows-x86_64": { "signature": "...", "url": "..." },
          #     "darwin-aarch64": { ... },
          #     "darwin-x86_64":  { ... }
          #   }
          # }
          PLATFORMS=$(jq -s 'add // {}' manifest-fragments/*.json 2>/dev/null || echo '{}')
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          # Release notes come from the most recent commit subject — short and
          # auto-derived. For richer notes, switch this to a CHANGELOG.md tail.
          NOTES=$(git log -1 --pretty=%s)
          jq -n \
            --arg version "${{ steps.version.outputs.version }}" \
            --arg notes "$NOTES" \
            --arg pub_date "$PUB_DATE" \
            --argjson platforms "$PLATFORMS" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' \
            > manifest.json
          echo "Generated manifest.json:"
          cat manifest.json

      - name: Upload manifest.json to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm install -g wrangler
          wrangler r2 object put "fmsdj-installers/current/manifest.json" \
            --file manifest.json \
            --content-type "application/json" \
            --remote
          echo "Manifest published — testers will see the update on next app launch."
